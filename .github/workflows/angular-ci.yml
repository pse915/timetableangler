name: Angular Preview Build (non-production)
on:
  workflow_dispatch:
  push:
    paths: ["frontend/**", ".github/workflows/angular-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install dependencies (lockfile created at first successful build)
        working-directory: frontend
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Compile Angular
        working-directory: frontend
        run: npm run build
      - name: Verify bundled iframe entry
        run: test -f frontend/dist/timetable-angular/browser/index.html
      - name: Upload artifact for manual validation (does not deploy to production)
        uses: actions/upload-artifact@v4
        with:
          name: timetable-angular-preview
          path: frontend/dist/timetable-angular/browser/
